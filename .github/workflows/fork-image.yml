# Builds this fork's native image for amd64 and arm64 and publishes it to GHCR.
# Mirrors the native jobs of build-images.yml without the upstream registries.
name: Fork image

on:
  push:
    branches: [cw/2.3.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ssrowe/floci
  VERSION: 2.3.0-cw.4

jobs:
  native:
    name: Build native executable (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            args: -march=x86-64-v2,-H:-AOTSingleCallsiteInline
          - arch: arm64
            runner: ubuntu-24.04-arm
            args: -H:-AOTSingleCallsiteInline
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          java-version: '25'
          distribution: mandrel
          cache: maven
          github-token: ${{ github.token }}
      - name: Build native executable
        run: ./mvnw clean package -Dnative -DskipTests -B -Dquarkus.native.additional-build-args-append="${{ matrix.args }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.arch }}
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish image
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-amd64
          path: native/amd64/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-arm64
          path: native/arm64/
      # Dockerfile.native-package runs /app/application.
      - name: Name the executables
        run: |
          for arch in amd64 arm64; do
            mv native/$arch/*-runner native/$arch/application
            chmod +x native/$arch/application
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.native-package
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ssrowe/floci
            org.opencontainers.image.version=${{ env.VERSION }}
